<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Business Website</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  transition:0.3s;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial, sans-serif;
  background:linear-gradient(to bottom,#f5f7fa,#d7e1ec);
}

/* HEADER */

header{
  background:blue;
  color:white;
  text-align:center;
  padding:40px 20px;
}

header img{
  width:120px;
  border-radius:50%;
  margin-bottom:20px;
}

header h1{
  font-size:55px;
  margin-bottom:20px;
}

header p{
  font-size:25px;
}

/* NAVIGATION */

nav{
  background:black;
  text-align:center;
  padding:20px;
}

nav a{
  color:white;
  text-decoration:none;
  display:block;
  padding:15px;
  font-size:28px;
}

nav a:hover{
  background:blue;
  border-radius:10px;
}

/* HERO SECTION */

.hero{
  background:linear-gradient(to right,#00e5ff,#00ffd5);
  text-align:center;
  padding:60px 20px;
  margin:20px;
  border-radius:20px;
  animation:fadeIn 2s;
}

.hero h1{
  color:white;
  font-size:55px;
  margin-bottom:20px;
}

/* BUTTONS */

.btn{
  background:blue;
  color:white;
  border:none;
  padding:15px 25px;
  border-radius:10px;
  font-size:18px;
  margin:10px;
  cursor:pointer;
}

.btn:hover{
  background:darkblue;
  transform:scale(1.05);
}

.btn2{
  background:white;
  color:blue;
  border:none;
  padding:15px 25px;
  border-radius:10px;
  font-size:18px;
  margin:10px;
  cursor:pointer;
}

.btn2:hover{
  background:lightgray;
  transform:scale(1.05);
}

/* SERVICES */

.services{
  padding:40px 20px;
  text-align:center;
}

.services h2{
  font-size:45px;
  margin-bottom:30px;
}

.cards{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
}

.card{
  background:white;
  width:250px;
  padding:25px;
  border-radius:20px;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.card:hover{
  transform:translateY(-10px);
}

.card h3{
  font-size:28px;
  margin-bottom:15px;
}

.card p{
  font-size:18px;
}

/* ABOUT SECTION */

.about{
  background:white;
  margin:20px;
  padding:50px 20px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.about h2{
  font-size:45px;
  margin-bottom:20px;
  color:blue;
}

.about p{
  font-size:20px;
  line-height:1.8;
  max-width:800px;
  margin:auto;
}

/* FOOTER */

footer{
  background:black;
  color:white;
  text-align:center;
  padding:20px;

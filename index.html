<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mercy Business</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  scroll-behavior:smooth;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  color:#333;
  overflow-x:hidden;
}

/* NAVBAR */

nav{
  background:#111;
  padding:15px;
  position:sticky;
  top:0;
  z-index:1000;
}

nav ul{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:30px;
  list-style:none;
}

nav a{
  color:white;
  text-decoration:none;
  font-size:18px;
  transition:0.3s;
}

nav a:hover{
  color:cyan;
}

/* HEADER */

header{
  height:100vh;

  background:
  linear-gradient(-45deg,#00c6ff,#0072ff,#8e2de2,#4a00e0);

  background-size:400% 400%;
  animation:gradientMove 10s ease infinite;

  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  padding:20px;
}

.header-content h1{
  font-size:70px;
  animation:slideDown 2s;
}

.typing{
  font-size:25px;
  margin:20px 0;
  border-right:3px solid white;
  overflow:hidden;
  white-space:nowrap;
  width:0;

  animation:
  typing 4s steps(30,end) forwards,
  blink 0.8s infinite;
}

/* BUTTON */

button{
  padding:15px 35px;
  border:none;
  border-radius:30px;
  background:white;
  color:black;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
  background:cyan;
}

/* ANIMATIONS */

@keyframes gradientMove{

  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }

}

@keyframes slideDown{

  from{
    transform:translateY(-100px);
    opacity:0;
  }

  to{
    transform:translateY(0);
    opacity:1;
  }

}

@keyframes typing{

  from{
    width:0;
  }

  to{
    width:100%;
  }

}

@keyframes blink{

  50%{
    border-color:transparent;
  }

}

/* SECTIONS */

section{
  padding:90px 20px;
  text-align:center;
}

section h2{
  font-size:42px;
  margin-bottom:20px;
}

section p{
  font-size:18px;
  max-width:700px;
  margin:auto;
}

/* COUNTERS */

.counter-container{
  display:flex;
  justify-content:center;
  flex-wrap:wrap
